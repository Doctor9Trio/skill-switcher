<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#0969da" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#58a6ff" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#3fb950" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- High-contrast rounded container (crisp on both light and dark browser tabs) -->
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2" />

  <!-- Top Toggle Track (Active Blue Skill) -->
  <rect x="5.5" y="6.5" width="21" height="8" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
  <circle cx="21.5" cy="10.5" r="3.2" fill="url(#blueGrad)" filter="url(#glowBlue)" />
  <circle cx="21.5" cy="10.5" r="1.4" fill="#ffffff" />

  <!-- Bottom Toggle Track (Active Green Telemetry) -->
  <rect x="5.5" y="17.5" width="21" height="8" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
  <circle cx="10.5" cy="21.5" r="3.2" fill="url(#greenGrad)" filter="url(#glowGreen)" />
  <circle cx="10.5" cy="21.5" r="1.4" fill="#ffffff" />

  <!-- Center Energy Link (Antigravity Switch Line) -->
  <path d="M19.5 12.5 L12.5 19.5" stroke="#58a6ff" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 1.5" />
  <!-- Center Sparkle / Neural Nexus -->
  <circle cx="16" cy="16" r="1.6" fill="#ffffff" />
</svg>
